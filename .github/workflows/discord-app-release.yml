# For app repos (TypeType-Android, TypeType-IOS, TypeType-TV, TypeType-tvOS).
# Pre-releases (-beta.N, -rc.N) go to #🧪・releases-rc, stable releases go to #🚀・releases-main,
# with the release notes. Needs the secrets DISCORD_WEBHOOK_RC and DISCORD_WEBHOOK_MAIN.
name: Discord release notify

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          WEBHOOK_RC: ${{ secrets.DISCORD_WEBHOOK_RC }}
          WEBHOOK_MAIN: ${{ secrets.DISCORD_WEBHOOK_MAIN }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          TAG: ${{ github.event.release.tag_name }}
          RNAME: ${{ github.event.release.name }}
          URL: ${{ github.event.release.html_url }}
          BODY: ${{ github.event.release.body }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            WEBHOOK="$WEBHOOK_RC"; EMOJI="🧪"; COLOR=15105570; INTRO="Beta build, might break, have fun (・ω・)"
          else
            WEBHOOK="$WEBHOOK_MAIN"; EMOJI="🚀"; COLOR=5763719; INTRO="New release (｡•̀ᴗ-)✧"
          fi
          [ -n "$WEBHOOK" ] || { echo "webhook secret not set"; exit 0; }
          TITLE="${EMOJI} ${RNAME:-${REPO#*/} ${TAG}}"
          jq -n \
            --arg title "$TITLE" \
            --arg url "$URL" \
            --arg desc "$(printf '%s\n\n%s' "$INTRO" "${BODY:-}" | cut -c1-3900)" \
            --argjson color "$COLOR" \
            '{username: "TypeType Releases", embeds: [{title: $title, url: $url, description: $desc, color: $color}]}' \
            > payload.json
          curl -fsS -H "Content-Type: application/json" -d @payload.json "$WEBHOOK"
